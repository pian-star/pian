<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leviann // developer</title>
<meta name="theme-color" content="#07070a">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

  :root{
    --bg: #07070a;
    --bg-raised: #0c0c11;
    --text: #d7dae0;
    --text-dim: #6b7280;
    --amber: #ffb02e;
    --cyan: #3ee6d0;
    --magenta: #ff3ea5;
    --line: #1c1e26;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at top left, rgba(62,230,208,0.05), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(255,62,165,0.05), transparent 45%);
  }

  /* CRT scanline overlay */
  .scanlines{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }
  .vignette{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 49;
    box-shadow: inset 0 0 160px rgba(0,0,0,0.75);
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 10vh 24px 10vh;
    position: relative;
    z-index: 1;
  }

  .winbar{
    display:flex;
    align-items:center;
    gap:8px;
    border: 1px solid var(--line);
    border-bottom: none;
    background: var(--bg-raised);
    padding: 9px 14px;
    border-radius: 8px 8px 0 0;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .dot{ width:10px; height:10px; border-radius:50%; background:#2a2c36; }

  .term{
    border: 1px solid var(--line);
    border-radius: 0 0 8px 8px;
    background: rgba(12,12,17,0.6);
    padding: 34px 30px 40px;
    line-height: 1.75;
    font-size: 14.5px;
  }

  .prompt{
    color: var(--text-dim);
  }
  .prompt .path{ color: var(--cyan); }
  .prompt .sep{ color: var(--text-dim); }

  .cmd{ color: var(--text); }

  .out{ margin: 4px 0 22px 0; color: var(--text); }
  .dim{ color: var(--text-dim); }

  .name-row{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap: wrap;
  }

  .avatar{
    width: 64px;
    height: 64px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid var(--line);
    filter: grayscale(35%) contrast(1.05);
    flex-shrink: 0;
  }

  /* glitch name */
  h1.name{
    font-size: clamp(38px, 9vw, 68px);
    font-weight: 800;
    margin: 6px 0 2px;
    letter-spacing: -0.01em;
    line-height: 1;
    position: relative;
    display: inline-block;
    color: var(--text);
  }
  h1.name::before,
  h1.name::after{
    content: attr(data-text);
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    clip-path: inset(0 0 0 0);
  }
  h1.name::before{
    color: var(--cyan);
    animation: glitchTop 3.6s infinite steps(1);
  }
  h1.name::after{
    color: var(--magenta);
    animation: glitchBottom 3.6s infinite steps(1);
  }
  @keyframes glitchTop{
    0%, 92%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0,0); }
    93% { clip-path: inset(0 0 78% 0); transform: translate(-2px,-1px); }
    94% { clip-path: inset(30% 0 40% 0); transform: translate(2px,1px); }
    95% { clip-path: inset(60% 0 5% 0); transform: translate(-1px,0); }
    96% { clip-path: inset(10% 0 60% 0); transform: translate(2px,0); }
    97%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0,0); }
  }
  @keyframes glitchBottom{
    0%, 91%, 100% { clip-path: inset(100% 0 0 0); transform: translate(0,0); }
    92% { clip-path: inset(70% 0 0 0); transform: translate(2px,1px); }
    93% { clip-path: inset(20% 0 55% 0); transform: translate(-2px,-1px); }
    94% { clip-path: inset(50% 0 15% 0); transform: translate(1px,0); }
    95% { clip-path: inset(5% 0 70% 0); transform: translate(-2px,0); }
    96%, 100% { clip-path: inset(100% 0 0 0); transform: translate(0,0); }
  }

  .tagline{
    color: var(--amber);
    font-size: 14px;
    letter-spacing: 0.02em;
    margin: 2px 0 28px;
  }
  .tagline::before{ content: "$ "; color: var(--text-dim); }

  .cursor{
    display:inline-block;
    width: 8px; height: 16px;
    background: var(--amber);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  table.links{
    width: 100%;
    border-collapse: collapse;
    margin-top: 2px;
  }
  table.links tr{ border-top: 1px solid var(--line); }
  table.links tr:first-child{ border-top: none; }
  table.links td{
    padding: 13px 0;
    vertical-align: baseline;
  }
  td.key{
    color: var(--text-dim);
    width: 110px;
    white-space: nowrap;
  }
  td.val a{
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  td.val a:hover,
  td.val a:focus-visible{
    color: var(--cyan);
    border-color: var(--cyan);
  }
  td.val a:focus-visible{ outline: none; }

  .footline{
    margin-top: 34px;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  @media (max-width: 520px){
    .term{ padding: 26px 18px 32px; font-size: 13.5px; }
    td.key{ width: 92px; }
  }

  @media (prefers-reduced-motion: reduce){
    h1.name::before, h1.name::after{ animation: none; display:none; }
    .cursor{ animation: none; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="wrap">
  <div class="winbar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span style="margin-left:6px;">leviann@home: ~</span>
  </div>

  <div class="term">
    <div class="prompt"><span class="path">leviann@home</span><span class="sep">:~$</span> <span class="cmd">whoami</span></div>
    <div class="out">
      <div class="name-row">
        <h1 class="name" data-text="leviann">leviann</h1>
        <img class="avatar" src="assets/avatar.jpg" alt="foto leviann">
      </div>
      <div class="tagline">developer<span class="cursor"></span></div>
    </div>

    <div class="prompt"><span class="path">leviann@home</span><span class="sep">:~$</span> <span class="cmd">cat socials.txt</span></div>
    <div class="out">
      <table class="links">
        <tr>
          <td class="key">x</td>
          <td class="val"><a href="https://x.com/FloxYx100" target="_blank" rel="noopener noreferrer">@FloxYx100</a></td>
        </tr>
        <tr>
          <td class="key">instagram</td>
          <td class="val"><a href="https://instagram.com/4lpiannnn" target="_blank" rel="noopener noreferrer">@4lpiannnn</a></td>
        </tr>
        <tr>
          <td class="key">github</td>
          <td class="val"><a href="https://github.com/leviann599-star" target="_blank" rel="noopener noreferrer">leviann599-star</a></td>
        </tr>
      </table>
    </div>

    <div class="prompt"><span class="path">leviann@home</span><span class="sep">:~$</span> <span class="cmd cursor" style="background:transparent;width:auto;"></span></div>
    <div class="footline">connection stable // last updated 2026</div>
  </div>
</div>

</body>
</html>
